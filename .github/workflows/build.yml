name: Build and package Decky plugin

on:
  push:
  pull_request:

jobs:
  decky-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test TabMaster and updater integration
        run: python -m unittest discover -s tests -v
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test controller grid navigation
        run: npm run test:navigation
      - name: Build and package ZIP
        run: bash scripts/package.sh
      - name: Publish installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: game-library-install-zip
          path: game-library-v*.zip
          if-no-files-found: error
