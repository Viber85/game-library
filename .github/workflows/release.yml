name: Publish Game Library release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test TabMaster and updater integration
        run: python -m unittest discover -s tests -v
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test controller grid navigation
        run: npm run test:navigation
      - name: Test animated sidebar focus and layout
        run: npm run test:sidebar
      - name: Test built-in theme window targeting
        run: npm run test:theme
      - name: Test minified Steam CSS class compatibility
        run: npm run test:css-aliases
      - name: Test Midnight 0.4.1 Settings and game details coverage
        run: npm run test:coverage
      - name: Test real Steam UI theme diagnostics
        run: npm run test:probe
      - name: Test pre-QAM native Steam CSS snapshots
        run: npm run test:audit
      - name: Test native Steam shortcut launching
        run: npm run test:launch
      - name: Test Steam achievements
        run: npm run test:achievements
      - name: Typecheck, build and package
        run: bash scripts/package.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          TAG="v${VERSION}"
          ZIP="game-library-v${VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite a previously published version."
            exit 0
          fi
          PREVIEW=()
          if [[ "$VERSION" == *"-"* ]]; then PREVIEW=(--prerelease); fi
          gh release create "$TAG" "$ZIP" \
            --title "Game Library ${TAG}" \
            --notes "Game Library v0.4.17: fixes the incorrect fallback Steam tab membership exposed by on-device MSI Claw diagnostics. Steam Game Mode returned 785 type-games entries but only 464 in the native all-games collection, 10 in local-install and 321 non-Steam shortcuts. Previously the Installed tab included all 321 non-Steam shortcuts because their app overview installed flag was true, displaying 331 instead of the native Steam Installed count of 10. Without TabMaster, default tabs now use native all-games, local-install and favorite collection IDs, and keep non-Steam shortcuts in a separate Non-Steam tab. Expected device counts: All Games 464, Installed 10, Favorites 0 from native source, Non-Steam 321. Missing collections use conservative Steam-only fallback filters. The diagnostics screen now distinguishes native Steam tabs from all installed overview flags. Regression tests recreate these precise counts, native collection wiring, empty favorites, unavailable collection fallbacks and legacy TabMaster integration. No Midnight, QAM, navigation, layout or overlay changes. CI tests and package validated; confirm actual handheld tab counts after updating." \
            --target "$GITHUB_SHA" \
            "${PREVIEW[@]}"
