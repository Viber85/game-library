name: Publish Game Library release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test TabMaster and updater integration
        run: python -m unittest discover -s tests -v
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test controller grid navigation
        run: npm run test:navigation
      - name: Test animated sidebar focus and layout
        run: npm run test:sidebar
      - name: Test built-in theme window targeting
        run: npm run test:theme
      - name: Test minified Steam CSS class compatibility
        run: npm run test:css-aliases
      - name: Test Midnight 0.4.1 Settings and game details coverage
        run: npm run test:coverage
      - name: Test real Steam UI theme diagnostics
        run: npm run test:probe
      - name: Test pre-QAM native Steam CSS snapshots
        run: npm run test:audit
      - name: Test native Steam shortcut launching
        run: npm run test:launch
      - name: Test Steam achievements
        run: npm run test:achievements
      - name: Typecheck, build and package
        run: bash scripts/package.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          TAG="v${VERSION}"
          ZIP="game-library-v${VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite a previously published version."
            exit 0
          fi
          PREVIEW=()
          if [[ "$VERSION" == *"-"* ]]; then PREVIEW=(--prerelease); fi
          gh release create "$TAG" "$ZIP" \
            --title "Game Library ${TAG}" \
            --notes "Game Library v0.4.18: fixes saved TabMaster tabs not returning automatically after TabMaster and UnifiedDeck are re-enabled in Decky. The previous 6-second poll was tied to the Dashboard React component, which can be unmounted or suspended while users navigate Decky's plugin manager. The automatic tab source monitor now lives at the Game Library plugin level and refreshes every 4 seconds, also checking on Steam/QAM focus return, visibility, pageshow, and after a short delayed wake-up while TabMaster/UnifiedDeck initialize. Single-flight requests, generation tracking and stale-response rejection protect against out-of-order Decky backend responses. When the source changes, the Dashboard automatically adopts the returned TabMaster tabs, refreshes native game inventories, selects a valid first tab and resets obsolete game selection without manual plugin refresh. No new settings toggle and no changes to v0.4.17 native Steam fallback collection membership, Midnight colors, QAM appearance, or notification transparency. CI regression suite simulates plugin re-enable with dashboard unmounted, stale async responses, focus wake, failures and lifecycle cleanup. Verify on-device restoration after enabling both plugins." \
            --target "$GITHUB_SHA" \
            "${PREVIEW[@]}"
