name: Publish Game Library preview release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test TabMaster and updater integration
        run: python -m unittest discover -s tests -v
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test controller grid navigation
        run: npm run test:navigation
      - name: Typecheck, build and package
        run: bash scripts/package.sh
      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          TAG="v${VERSION}"
          ZIP="game-library-v${VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite a previously published version."
            exit 0
          fi
          gh release create "$TAG" "$ZIP" \
            --title "Game Library ${TAG} (development preview)" \
            --notes "Game Library v0.2.0-test.9 fixes full-grid controller focus. D-pad arrows now stay within the grid, detect the actual responsive column count, and move one visual row at a time. Pressing left on a left-edge card no longer opens the sidebar. Removed nested Steam focus scope and mouse hover interference; pending focus is retained while more games load. Node navigation regression tests added and pass. Verify on handheld." \
            --target "$GITHUB_SHA" \
            --prerelease
