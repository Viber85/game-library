name: Publish Game Library preview release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test TabMaster and updater integration
        run: python -m unittest discover -s tests -v
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test controller grid navigation
        run: npm run test:navigation
      - name: Test built-in theme window targeting
        run: npm run test:theme
      - name: Test minified Steam CSS class compatibility
        run: npm run test:css-aliases
      - name: Test native Steam shortcut launching
        run: npm run test:launch
      - name: Test Steam achievements
        run: npm run test:achievements
      - name: Typecheck, build and package
        run: bash scripts/package.sh
      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          TAG="v${VERSION}"
          ZIP="game-library-v${VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite a previously published version."
            exit 0
          fi
          gh release create "$TAG" "$ZIP" \
            --title "Game Library ${TAG} (development preview)" \
            --notes "Game Library v0.2.0-test.15: Midnight is now the built-in default system-wide Game Mode color theme, with NO CSS Loader dependency. Decky-native CSS injection handles Steam Menu, QAM, Settings, Downloads, buttons and dialogs and re-applies when Steam opens or reloads these windows. Appearance in Game Library includes an On/Off switch persisted across restarts, and disabling restores native Steam colors. Legacy CSS Loader installer has been removed. Theme registry is prepared for future variants; on-device compatibility still requires confirmation." \
            --target "$GITHUB_SHA" \
            --prerelease
