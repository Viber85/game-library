name: Publish Game Library release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test TabMaster and updater integration
        run: python -m unittest discover -s tests -v
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test controller grid navigation
        run: npm run test:navigation
      - name: Test animated sidebar focus and layout
        run: npm run test:sidebar
      - name: Test built-in theme window targeting
        run: npm run test:theme
      - name: Test minified Steam CSS class compatibility
        run: npm run test:css-aliases
      - name: Test Midnight 0.4.1 Settings and game details coverage
        run: npm run test:coverage
      - name: Test real Steam UI theme diagnostics
        run: npm run test:probe
      - name: Test pre-QAM native Steam CSS snapshots
        run: npm run test:audit
      - name: Test native Steam shortcut launching
        run: npm run test:launch
      - name: Test Steam achievements
        run: npm run test:achievements
      - name: Typecheck, build and package
        run: bash scripts/package.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          TAG="v${VERSION}"
          ZIP="game-library-v${VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite a previously published version."
            exit 0
          fi
          PREVIEW=()
          if [[ "$VERSION" == *"-"* ]]; then PREVIEW=(--prerelease); fi
          gh release create "$TAG" "$ZIP" \
            --title "Game Library ${TAG}" \
            --prerelease \
            --notes "Game Library v0.5.6-test.3: Revert Select/View game-details shortcut from test.2 — Select is unassigned again. On a focused Home carousel or Midnight Library grid game cover, Start/Menu now opens Steam's real native game context menu for that game's verified AppID (the same menu with Favorites, Manage, Developer, Change Artwork and third-party plugin items). The implementation follows real SteamUI exported LibraryContextMenu / AppMenu module markers used by SteamGridDB and LiquidAss-Frame, and calls Decky's onMenuButton + showContextMenu with genuine overview/client/launchSource and ownerWindow. No fake controller events, no hand-written menu duplicate and no global Steam context-menu patch. Y remains Sort, A/B and L1/R1 remain unchanged. If the native component is not available on a client, show a safe notice rather than an incorrect game or broken overlay. Automated tests, typecheck and packaging passed; please verify Start on a real MSI Claw game cover." \
            --target "$GITHUB_SHA" \
            "${PREVIEW[@]}"
