name: Publish Game Library release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test TabMaster and updater integration
        run: python -m unittest discover -s tests -v
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test controller grid navigation
        run: npm run test:navigation
      - name: Test animated sidebar focus and layout
        run: npm run test:sidebar
      - name: Test built-in theme window targeting
        run: npm run test:theme
      - name: Test minified Steam CSS class compatibility
        run: npm run test:css-aliases
      - name: Test Midnight 0.4.1 Settings and game details coverage
        run: npm run test:coverage
      - name: Test real Steam UI theme diagnostics
        run: npm run test:probe
      - name: Test pre-QAM native Steam CSS snapshots
        run: npm run test:audit
      - name: Test native Steam shortcut launching
        run: npm run test:launch
      - name: Test Steam achievements
        run: npm run test:achievements
      - name: Typecheck, build and package
        run: bash scripts/package.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          TAG="v${VERSION}"
          ZIP="game-library-v${VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite a previously published version."
            exit 0
          fi
          PREVIEW=()
          if [[ "$VERSION" == *"-"* ]]; then PREVIEW=(--prerelease); fi
          gh release create "$TAG" "$ZIP" \
            --title "Game Library ${TAG}" \
            --notes "Game Library v0.5.5-test.2: Fix SteamGridDB API key verification error on SteamOS. The plugin now uses Decky Loader's real trusted SSL context (helpers.get_ssl_context) rather than urllib's unconfigured default, with verifying certifi/platform fallback outside Decky and strict no-redirect handling for bearer credentials. Correctly distinguishes invalid key (HTTP 401), forbidden API access (403), rate limit (429), server errors (5xx), SSL certificates, timeouts, network issues and invalid replies instead of the misleading generic connection warning. SteamGridDB key is removed immediately from the input after Save to avoid visibly lingering on Game Mode. Original Game Library auto-fill missing Steam cover and hero behavior from test.1 and Midnight theme are unchanged. Builds and automated tests passed; actual SteamOS API verification needs handheld confirmation. Please report any new error message but never share your private key." \
            --target "$GITHUB_SHA" \
            "${PREVIEW[@]}"
