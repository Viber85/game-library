name: Publish Game Library release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test TabMaster and updater integration
        run: python -m unittest discover -s tests -v
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test controller grid navigation
        run: npm run test:navigation
      - name: Test animated sidebar focus and layout
        run: npm run test:sidebar
      - name: Test built-in theme window targeting
        run: npm run test:theme
      - name: Test minified Steam CSS class compatibility
        run: npm run test:css-aliases
      - name: Test Midnight 0.4.1 Settings and game details coverage
        run: npm run test:coverage
      - name: Test real Steam UI theme diagnostics
        run: npm run test:probe
      - name: Test pre-QAM native Steam CSS snapshots
        run: npm run test:audit
      - name: Test native Steam shortcut launching
        run: npm run test:launch
      - name: Test Steam achievements
        run: npm run test:achievements
      - name: Typecheck, build and package
        run: bash scripts/package.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          TAG="v${VERSION}"
          ZIP="game-library-v${VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite a previously published version."
            exit 0
          fi
          PREVIEW=()
          if [[ "$VERSION" == *"-"* ]]; then PREVIEW=(--prerelease); fi
          gh release create "$TAG" "$ZIP" \
            --title "Game Library ${TAG}" \
            --notes "Game Library v0.4.21-test.3 (preview): fixes the still-clipped native Steam menu focus outline and missing QAM focus glow reported in MSI Claw screenshots. Steam menu now targets the actual mainmenu_Item class even if outside the #MainNavMenuContainer ancestor, leaves 6px vertical and 14px horizontal room, and draws a fully inset decorative cyan frame inside the focused row, transparent to pointer events. The native QAM selected/focused icon is styled directly via quickaccessmenu_Tab, without requiring its DOM ancestry under the QuickAccess root, and both the 86px Tabs rail and actual 74px TabContentColumn are widened safely. Selected QAM sections retain a cyan ring while focus is on a plugin panel; actual icon focus brightens the glow. Also corrects CSS alias resolution for trailing-underscore selectors in minified Steam client builds, the likely reason previous QAM rules did not apply. Stylesheet revision 54 removes old cached CSS. Tests cover actual Steam selectors, safe pointer-transparent decoration, alias expansion, QAM selected/focused state, CSS syntax and scope, TypeScript, Python, and real ZIP CSS content. Volume/achievement transparency, Steam Input mappings, TabMaster, game launch and plugin panel widths are unchanged. On-device visual confirmation is still required; this is a test release." \
            --target "$GITHUB_SHA" \
            "${PREVIEW[@]}"
