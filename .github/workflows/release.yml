name: Publish Game Library release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test TabMaster and updater integration
        run: python -m unittest discover -s tests -v
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test controller grid navigation
        run: npm run test:navigation
      - name: Test animated sidebar focus and layout
        run: npm run test:sidebar
      - name: Test built-in theme window targeting
        run: npm run test:theme
      - name: Test minified Steam CSS class compatibility
        run: npm run test:css-aliases
      - name: Test Midnight 0.4.1 Settings and game details coverage
        run: npm run test:coverage
      - name: Test real Steam UI theme diagnostics
        run: npm run test:probe
      - name: Test pre-QAM native Steam CSS snapshots
        run: npm run test:audit
      - name: Test native Steam shortcut launching
        run: npm run test:launch
      - name: Test Steam achievements
        run: npm run test:achievements
      - name: Typecheck, build and package
        run: bash scripts/package.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          TAG="v${VERSION}"
          ZIP="game-library-v${VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite a previously published version."
            exit 0
          fi
          PREVIEW=()
          if [[ "$VERSION" == *"-"* ]]; then PREVIEW=(--prerelease); fi
          gh release create "$TAG" "$ZIP" \
            --title "Game Library ${TAG}" \
            --notes "Game Library v0.4.21-test.9 (preview): adds Midnight cyan focus styling to the native Steam Power context menu and the transient hardware Volume popup. Power menu retains its original actions, positions, controller focus behavior, and transparent in-game backdrop while selected items use a single inset cyan ring, dark-blue gradient and soft glow instead of the white native highlight. Volume popup alone gets a navy background, light cyan border, shadow, readable label and cyan slider track; the CEF root and in-game visuals remain transparent and unchanged. Native Steam UI selectors resolve minified client CSS classes via audio/gamepadcontextmenu/basiccontextmenu module aliases. Volume CSS loads in main and overlay; Power only in overlay. QAM and main Steam navigation CSS are untouched. Native stylesheet revision 60 invalidates cached theme CSS. Regression tests guard against layout changes, missing handlers or full-screen painting; MSI Claw visual confirmation is required." \
            --target "$GITHUB_SHA" \
            "${PREVIEW[@]}"
