name: Publish Game Library release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test TabMaster and updater integration
        run: python -m unittest discover -s tests -v
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test controller grid navigation
        run: npm run test:navigation
      - name: Test animated sidebar focus and layout
        run: npm run test:sidebar
      - name: Test built-in theme window targeting
        run: npm run test:theme
      - name: Test minified Steam CSS class compatibility
        run: npm run test:css-aliases
      - name: Test Midnight 0.4.1 Settings and game details coverage
        run: npm run test:coverage
      - name: Test real Steam UI theme diagnostics
        run: npm run test:probe
      - name: Test pre-QAM native Steam CSS snapshots
        run: npm run test:audit
      - name: Test native Steam shortcut launching
        run: npm run test:launch
      - name: Test Steam achievements
        run: npm run test:achievements
      - name: Typecheck, build and package
        run: bash scripts/package.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          TAG="v${VERSION}"
          ZIP="game-library-v${VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite a previously published version."
            exit 0
          fi
          PREVIEW=()
          if [[ "$VERSION" == *"-"* ]]; then PREVIEW=(--prerelease); fi
          gh release create "$TAG" "$ZIP" \
            --title "Game Library ${TAG}" \
            --notes "Game Library v0.4.21-test.19 (preview): fix a brief light-blue flash of Decky Loader Settings LEFT sidebar when switching General, Plugins, Developer or Testing. test.18 successfully themed all four pages on MSI Claw but left rail CSS incorrectly depended on the RIGHT DialogControlsSection staying mounted. Decky briefly unmounts it during transition, exposing Valve light-blue sidebar. Add one CSS-only fallback for the actual persistent .BasicUI .Panel:has(> .PageListColumn) and its direct child PageListColumn, keeping navy #081425 even if the right content temporarily disappears. Remove only native background image/transition on that rail, with NO changes to right content, focus, row sizes, QAM, Power, Volume or other theme controls. Style revision 70; regression test and Chromium transition check. Physical device verification still required." \
            --target "$GITHUB_SHA" \
            "${PREVIEW[@]}"
