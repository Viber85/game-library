name: Publish Game Library release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test TabMaster and updater integration
        run: python -m unittest discover -s tests -v
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test controller grid navigation
        run: npm run test:navigation
      - name: Test animated sidebar focus and layout
        run: npm run test:sidebar
      - name: Test built-in theme window targeting
        run: npm run test:theme
      - name: Test minified Steam CSS class compatibility
        run: npm run test:css-aliases
      - name: Test Midnight 0.4.1 Settings and game details coverage
        run: npm run test:coverage
      - name: Test real Steam UI theme diagnostics
        run: npm run test:probe
      - name: Test pre-QAM native Steam CSS snapshots
        run: npm run test:audit
      - name: Test native Steam shortcut launching
        run: npm run test:launch
      - name: Test Steam achievements
        run: npm run test:achievements
      - name: Typecheck, build and package
        run: bash scripts/package.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          TAG="v${VERSION}"
          ZIP="game-library-v${VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite a previously published version."
            exit 0
          fi
          PREVIEW=()
          if [[ "$VERSION" == *"-"* ]]; then PREVIEW=(--prerelease); fi
          gh release create "$TAG" "$ZIP" \
            --title "Game Library ${TAG}" \
            --notes "Game Library v0.5.7 stable: Fast HowLongToBeat sorting now bulk-loads existing HLTB Main + Extras (comp_plus) times directly from local hltb_cache.json via one read-only Decky backend call (chunked for large libraries), with no HTTP calls during prewarm. It starts as soon as a library tab is shown and immediately sorts by local cached values. Only games with missing or expired results enter the existing slow rate-limited HLTB remote refresh queue (one at a time); negative results are correctly cached for 12 hours, while positive results stay fresh for 7 days. Expired positive times remain visible during refresh and after provider outages, with short error backoff. Bulk cache access stays responsive even if another HLTB lookup is waiting for network. Exact AppID + title matching prevents wrong-game reuse. No change to cache file format, HLTB sort meaning, SteamGridDB images, per-tab sort selections, native Steam START options, Select behavior, previous Game Details B return fix or Midnight theme. Full CI typecheck, backend, navigation and ZIP package tests passed. Real MSI Claw restart and HLTB sorting verification requested." \
            --target "$GITHUB_SHA" \
            "${PREVIEW[@]}"
