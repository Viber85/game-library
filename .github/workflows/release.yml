name: Publish Game Library release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test TabMaster and updater integration
        run: python -m unittest discover -s tests -v
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test controller grid navigation
        run: npm run test:navigation
      - name: Test animated sidebar focus and layout
        run: npm run test:sidebar
      - name: Test built-in theme window targeting
        run: npm run test:theme
      - name: Test minified Steam CSS class compatibility
        run: npm run test:css-aliases
      - name: Test Midnight 0.4.1 Settings and game details coverage
        run: npm run test:coverage
      - name: Test real Steam UI theme diagnostics
        run: npm run test:probe
      - name: Test pre-QAM native Steam CSS snapshots
        run: npm run test:audit
      - name: Test native Steam shortcut launching
        run: npm run test:launch
      - name: Test Steam achievements
        run: npm run test:achievements
      - name: Typecheck, build and package
        run: bash scripts/package.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          TAG="v${VERSION}"
          ZIP="game-library-v${VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite a previously published version."
            exit 0
          fi
          PREVIEW=()
          if [[ "$VERSION" == *"-"* ]]; then PREVIEW=(--prerelease); fi
          gh release create "$TAG" "$ZIP" \
            --title "Game Library ${TAG}" \
            --notes "Game Library v0.4.21-test.18 (device preview): implement Midnight colors using ACTUAL Steam CEF classes captured from MSI Claw test.17, not guessed Decky Router URL. The Decky route marker was Not detected; real left navigation uses PageListColumn inside a Panel (rgb 43,45,51) and real right DialogControlsSection uses separate Panel and repeated gray Field class _eKmEXJCm_ (rgb 35,38,46). New CSS relational selectors html:has(.BasicUI .PageListColumn):has(.BasicUI .DialogControlsSection) paint these visible Steam elements directly on mount, without waiting for an asynchronous marker. Colors: sidebar #081425, main #0a1b30, card idle #0f2842, focus #163a5e without outline or glow, matching button blues. Leave widths, input/navigation actions, switches, plugin install and other Steam menus unchanged. Diagnostics now distinguish actual native Decky DOM presence from a direct CSS :has computed-property match. Style marker revision 69, watcher revision 17. New device-evidence regression tests and package guards. On-device confirmation still needed." \
            --target "$GITHUB_SHA" \
            "${PREVIEW[@]}"
