name: Publish Game Library release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test TabMaster and updater integration
        run: python -m unittest discover -s tests -v
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test controller grid navigation
        run: npm run test:navigation
      - name: Test animated sidebar focus and layout
        run: npm run test:sidebar
      - name: Test built-in theme window targeting
        run: npm run test:theme
      - name: Test minified Steam CSS class compatibility
        run: npm run test:css-aliases
      - name: Test Midnight 0.4.1 Settings and game details coverage
        run: npm run test:coverage
      - name: Test real Steam UI theme diagnostics
        run: npm run test:probe
      - name: Test pre-QAM native Steam CSS snapshots
        run: npm run test:audit
      - name: Test native Steam shortcut launching
        run: npm run test:launch
      - name: Test Steam achievements
        run: npm run test:achievements
      - name: Typecheck, build and package
        run: bash scripts/package.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          TAG="v${VERSION}"
          ZIP="game-library-v${VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite a previously published version."
            exit 0
          fi
          PREVIEW=()
          if [[ "$VERSION" == *"-"* ]]; then PREVIEW=(--prerelease); fi
          gh release create "$TAG" "$ZIP" \
            --title "Game Library ${TAG}" \
            --prerelease \
            --notes "Game Library v0.5.6-test.1: Midnight Library route instead of Valve's native Library when selecting the Game Library left rail Library item. Reuses current native Steam/TabMaster/Unifideck full grid, controller navigation and SteamGridDB artwork; original Steam Library stays available through a dedicated button. New D-pad/touch Sort menu offers 11 user-approved criteria with both directions where relevant: Recent, A-Z/Z-A, Most/Least/Never Played, Recently Added via Steam rt_purchased_time, Release Date via verified Steam overview fields, HLTB shortest/longest using Main+Extras comp_plus only, ProtonDB ranking, achievement completion and installed game size using Steam size_on_disk. Random omitted. Missing data goes last in either direction. External metadata is queried only on demand, at low concurrency and with a visible partial sorting counter; no guessed game data and no massive unconditional bulk fetches. Installed default remains Recent; tab-specific sort choices persist for the plugin session. Only own Decky route added, native Steam Library remains untouched. Automated tests/build passed; physical-device visual test required." \
            --target "$GITHUB_SHA" \
            "${PREVIEW[@]}"
