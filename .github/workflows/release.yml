name: Publish Game Library preview release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test TabMaster and updater integration
        run: python -m unittest discover -s tests -v
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test controller grid navigation
        run: npm run test:navigation
      - name: Test built-in theme window targeting
        run: npm run test:theme
      - name: Test minified Steam CSS class compatibility
        run: npm run test:css-aliases
      - name: Test native Steam shortcut launching
        run: npm run test:launch
      - name: Test Steam achievements
        run: npm run test:achievements
      - name: Typecheck, build and package
        run: bash scripts/package.sh
      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          TAG="v${VERSION}"
          ZIP="game-library-v${VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite a previously published version."
            exit 0
          fi
          gh release create "$TAG" "$ZIP" \
            --title "Game Library ${TAG} (development preview)" \
            --notes "Game Library v0.2.0-test.16: fix Midnight coverage on native Steam Settings and game-details pages. Uses correct PagedSettingsDialog classes, a dedicated game-details stylesheet for metadata, Play bar and Activity, and runtime Steam CSS-class alias resolution to handle minified class names. Re-applies styles on lazy-loaded pages and removes older CSS revisions left by hot reload. No CSS Loader required. GitHub test/build verification passed; visual confirmation on device still required." \
            --target "$GITHUB_SHA" \
            --prerelease
