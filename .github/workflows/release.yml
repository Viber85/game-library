name: Publish Game Library release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test TabMaster and updater integration
        run: python -m unittest discover -s tests -v
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test controller grid navigation
        run: npm run test:navigation
      - name: Test animated sidebar focus and layout
        run: npm run test:sidebar
      - name: Test built-in theme window targeting
        run: npm run test:theme
      - name: Test minified Steam CSS class compatibility
        run: npm run test:css-aliases
      - name: Test Midnight 0.4.1 Settings and game details coverage
        run: npm run test:coverage
      - name: Test real Steam UI theme diagnostics
        run: npm run test:probe
      - name: Test pre-QAM native Steam CSS snapshots
        run: npm run test:audit
      - name: Test native Steam shortcut launching
        run: npm run test:launch
      - name: Test Steam achievements
        run: npm run test:achievements
      - name: Typecheck, build and package
        run: bash scripts/package.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          TAG="v${VERSION}"
          ZIP="game-library-v${VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite a previously published version."
            exit 0
          fi
          PREVIEW=()
          if [[ "$VERSION" == *"-"* ]]; then PREVIEW=(--prerelease); fi
          gh release create "$TAG" "$ZIP" \
            --title "Game Library ${TAG}" \
            --notes "Game Library v0.4.21-test.15 (preview): Midnight native Decky Loader Settings theme for General, Plugins, Developer and Testing, matching the Game Library navy and lighter blue focus with no outlines/glow. Previously the DOM watcher accepted only 9+ Steam Settings navigation rows; Decky's 4-item SidebarNavigation was not detected. The existing synchronous pre-paint MutationObserver now recognizes the verified 4-tab native layout, attaching a Decky-only root marker before painting. A single main-window decky-settings.css adds #0a1b30 canvas, #081425 sidebar, #0f2842 ordinary rows, #163a5e focus, #123452/#1d527d buttons. No delayed per-page CSS injection, no navigation or element sizing changes, no impact on other SteamOS screens, QAM, Power or Volume. CSS revision 66 and watcher revision 14. Automated tests before publishing; visual verification on Claw required." \
            --target "$GITHUB_SHA" \
            "${PREVIEW[@]}"
