name: Publish Game Library release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test TabMaster and updater integration
        run: python -m unittest discover -s tests -v
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test controller grid navigation
        run: npm run test:navigation
      - name: Test animated sidebar focus and layout
        run: npm run test:sidebar
      - name: Test built-in theme window targeting
        run: npm run test:theme
      - name: Test minified Steam CSS class compatibility
        run: npm run test:css-aliases
      - name: Test Midnight 0.4.1 Settings and game details coverage
        run: npm run test:coverage
      - name: Test real Steam UI theme diagnostics
        run: npm run test:probe
      - name: Test pre-QAM native Steam CSS snapshots
        run: npm run test:audit
      - name: Test native Steam shortcut launching
        run: npm run test:launch
      - name: Test Steam achievements
        run: npm run test:achievements
      - name: Typecheck, build and package
        run: bash scripts/package.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          TAG="v${VERSION}"
          ZIP="game-library-v${VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite a previously published version."
            exit 0
          fi
          PREVIEW=()
          if [[ "$VERSION" == *"-"* ]]; then PREVIEW=(--prerelease); fi
          gh release create "$TAG" "$ZIP" \
            --title "Game Library ${TAG}" \
            --notes "Game Library 0.5.5-test.1: Optional automatic SteamGridDB v2 fallback for missing Steam game portrait covers and wide hero images. Try custom/native Steam artwork first and search SteamGridDB only after every matching native asset fails. Select by strict normalized game title (no sequel guessing), choose safe static image ratios, cache success and no-match results on disk, and deduplicate concurrent requests. SteamGridDB personal API key is required: open Decky Game Library → SteamGridDB Artwork to paste a free key from steamgriddb.com/profile/preferences/api, then enable Auto-fill. The key stays in a separate local 0600-permission file; it is not returned to the frontend or packaged in this ZIP. Art is displayed in Game Library only (no writes to Steam's library). Epic/GOG shortcuts, other plugin assets, game navigation, and the Midnight visual theme remain unchanged. All automated builds/tests passed; requires on-device test with a valid user key." \
            --target "$GITHUB_SHA" \
            "${PREVIEW[@]}"
