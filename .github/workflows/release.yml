name: Publish Game Library release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test TabMaster and updater integration
        run: python -m unittest discover -s tests -v
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test controller grid navigation
        run: npm run test:navigation
      - name: Test animated sidebar focus and layout
        run: npm run test:sidebar
      - name: Test built-in theme window targeting
        run: npm run test:theme
      - name: Test minified Steam CSS class compatibility
        run: npm run test:css-aliases
      - name: Test Midnight 0.4.1 Settings and game details coverage
        run: npm run test:coverage
      - name: Test real Steam UI theme diagnostics
        run: npm run test:probe
      - name: Test pre-QAM native Steam CSS snapshots
        run: npm run test:audit
      - name: Test native Steam shortcut launching
        run: npm run test:launch
      - name: Test Steam achievements
        run: npm run test:achievements
      - name: Typecheck, build and package
        run: bash scripts/package.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          TAG="v${VERSION}"
          ZIP="game-library-v${VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite a previously published version."
            exit 0
          fi
          PREVIEW=()
          if [[ "$VERSION" == *"-"* ]]; then PREVIEW=(--prerelease); fi
          gh release create "$TAG" "$ZIP" \
            --title "Game Library ${TAG}" \
            --notes "Game Library v0.4.21-test.22 (device preview): fixes the shared Steam and Decky Settings navigation flash when the user uses D-pad or left analog rather than touch. Root cause is Steam native controller focus styles and transient focus highlight layers, not Decky page loading. Add a main Steam CEF-only settings-gamepad-focus.css LAST after previous verified Decky v18 CSS; targets only the real .BasicUI .PageListColumn native Settings rail and its Panel/Focusable nav rows. Keeps rail navy #081425, focused/selected rows consistent Midnight #163a5e. Clears native controller pseudo ::before/::after blue overlays and disables nav-only color/focus animation on both entering/leaving focus. Never depends on right DialogControlsSection, browser URL or polling and does not touch main content, gamepad navigation, icons, controls, QAM, Power or Volume. Original Decky v18 CSS and test.21 isolation guards remain. CSS revision 73 forces new stylesheet. Automated regression tests check both Settings, cascade order, scoped selectors and no geometry changes; on-device validation required." \
            --target "$GITHUB_SHA" \
            "${PREVIEW[@]}"
