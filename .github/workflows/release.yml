name: Publish Game Library release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test TabMaster and updater integration
        run: python -m unittest discover -s tests -v
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test controller grid navigation
        run: npm run test:navigation
      - name: Test animated sidebar focus and layout
        run: npm run test:sidebar
      - name: Test built-in theme window targeting
        run: npm run test:theme
      - name: Test minified Steam CSS class compatibility
        run: npm run test:css-aliases
      - name: Test Midnight 0.4.1 Settings and game details coverage
        run: npm run test:coverage
      - name: Test real Steam UI theme diagnostics
        run: npm run test:probe
      - name: Test pre-QAM native Steam CSS snapshots
        run: npm run test:audit
      - name: Test native Steam shortcut launching
        run: npm run test:launch
      - name: Test Steam achievements
        run: npm run test:achievements
      - name: Typecheck, build and package
        run: bash scripts/package.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          TAG="v${VERSION}"
          ZIP="game-library-v${VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite a previously published version."
            exit 0
          fi
          PREVIEW=()
          if [[ "$VERSION" == *"-"* ]]; then PREVIEW=(--prerelease); fi
          gh release create "$TAG" "$ZIP" \
            --title "Game Library ${TAG}" \
            --prerelease \
            --notes "Game Library v0.5.6-test.4: Improved the HLTB Main + Extras sorting-progress notification after MSI Claw feedback. Replaces the tiny bottom-right text that overlapped the controller/Steam Back footer with a prominent navy-and-cyan status card showing provider name, hourglass icon, larger real completed/total game counter, blue progress bar and clear explanation that sorting is ongoing and missing data goes last. In Midnight Library full grid the card occupies its own row below the grid header, never covering the game covers or Y/Start/B/L1/R1 hint. In Home it appears near the tabs rather than the footer. Same visuals apply to ProtonDB/achievement metadata loading. Progress uses the real existing counters. No changes to HLTB/ProtonDB request/cache logic, SteamGridDB artwork, native Steam Start options, Select/Y mapping, theme system CSS, sorting results or game navigation. CI test/build/ZIP packaging passed; handheld visual confirmation requested." \
            --target "$GITHUB_SHA" \
            "${PREVIEW[@]}"
