name: Publish Game Library release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test TabMaster and updater integration
        run: python -m unittest discover -s tests -v
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test controller grid navigation
        run: npm run test:navigation
      - name: Test animated sidebar focus and layout
        run: npm run test:sidebar
      - name: Test built-in theme window targeting
        run: npm run test:theme
      - name: Test minified Steam CSS class compatibility
        run: npm run test:css-aliases
      - name: Test Midnight 0.4.1 Settings and game details coverage
        run: npm run test:coverage
      - name: Test real Steam UI theme diagnostics
        run: npm run test:probe
      - name: Test pre-QAM native Steam CSS snapshots
        run: npm run test:audit
      - name: Test native Steam shortcut launching
        run: npm run test:launch
      - name: Test Steam achievements
        run: npm run test:achievements
      - name: Typecheck, build and package
        run: bash scripts/package.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          TAG="v${VERSION}"
          ZIP="game-library-v${VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite a previously published version."
            exit 0
          fi
          PREVIEW=()
          if [[ "$VERSION" == *"-"* ]]; then PREVIEW=(--prerelease); fi
          gh release create "$TAG" "$ZIP" \
            --title "Game Library ${TAG}" \
            --notes "Game Library v0.4.21-test.1 (preview): adds scoped Midnight styling for the in-game Steam button / active-game menu and Steam Input controller layout overview/configuration. The running-game menu's navigation and action column use navy Midnight backgrounds and focus-only cyan indicators. Steam Input's controller summary, control labels and action buttons use the same palette; native controller diagrams, button assignments, artwork, positions and control actions are unchanged. Steam menu CSS loads only in the overlay scope; controller-input CSS loads in both Game Mode and Steam menu overlays. Selector fallbacks for known semantic class names and current minified Steam modules were added. No global GamepadUI/BasicUI background paint: transparent volume and achievement overlays remain untouched. CSS marker rev52 ensures current styles replace cached older sheets. Automated tests cover scoping, syntax, class aliases, Python theme bundles and ZIP file inclusion, with all existing TypeScript and Decky tests. This is a test build; SteamOS visual behavior requires the owner's MSI Claw confirmation." \
            --target "$GITHUB_SHA" \
            "${PREVIEW[@]}"
